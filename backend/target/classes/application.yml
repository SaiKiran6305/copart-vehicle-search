spring:
  application:
    name: copart-vehicle-search
  datasource:
    url: jdbc:h2:file:./data/copartdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: ${PORT:8080}
