spring:
  application:
    name: copart-vehicle-search
  datasource:
    url: jdbc:h2:file:./data/copartdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # Off by default so the database console is never exposed on the public deployment.
      # Run locally with H2_CONSOLE_ENABLED=true to use it at /h2-console.
      enabled: ${H2_CONSOLE_ENABLED:false}

server:
  port: ${PORT:8080}
  # Compress API responses. The frontend's files are compressed at build time (see StaticResourceConfig).
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 1KB

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5.6-luna}

ai-search:
  rate-limit:
    # Per visitor (by IP) per minute, and across all visitors per hour.
    per-client-per-minute: ${AI_SEARCH_LIMIT_PER_MINUTE:10}
    global-per-hour: ${AI_SEARCH_LIMIT_PER_HOUR:200}
